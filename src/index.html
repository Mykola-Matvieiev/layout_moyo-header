<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

  <body>
    <header class="header">
      <div class="container">
        <a
          href="#"

        <nav class="menu">
          <ul class="menu__list">
            <li class="menu__item is-active">
              <a href="#">apple</a>
            </li>

            <li class="menu__item">
              <a href="#">samsung</a>
            </li>
            <li class="menu__item">
              <a href="#">smartphones</a>
            </li>

            <li class="menu__item">
              <a
                href="#"
                data-qa="hover"
              >
                laptops & computers
              </a>
            </li>
            <li class="menu__item"><a href="#">gadgets</a></li>
            <li class="menu__item"><a href="#">pablets</a></li>
            <li class="menu__item"><a href="#">photo</a></li>
            <li class="menu__item"><a href="#">video</a></li>
          </ul>

</html>
